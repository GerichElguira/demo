<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="disp" class="disp">Hello world</h1>
    <button id="btnChange" class="btn btn-primary">Change Text Color</button>
    <script>
        const button = document.getElementById("btnChange");
        const disp = document.getElementById("disp");

        
        button.addEventListener("mouseout", function() {
            disp.innerHTML = "Hello Mars";
            disp.style.color = "red";
            disp.classList.add("display-1");
        });
    </script>
</body>
</html>
